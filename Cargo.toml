[workspace]
members = ["crates/hfx-bridge", "crates/hfx-core", "crates/hfx-daemon", "crates/hfx-device-qualification", "crates/hfx-domain", "crates/hfx-errors", "crates/hfx-integration-model", "crates/hfx-kernel-transport", "crates/hfx-ops", "crates/hfx-profiles", "crates/hfx-protocol", "crates/hfx-runtime", "crates/hfx-sdk", "crates/hfx-sim", "crates/hfx-system-probe", "crates/hfx-uhid-relay"]
resolver = "3"

[workspace.package]
version = "2.1.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
rustix = { version = "=1.1.5", features = ["fs", "process", "rand", "time"] }
signal-hook = { version = "=0.4.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.operations]
inherits = "release"
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.relay]
inherits = "release"
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
