# Generated by ./hfx generate. Do not edit manually.
name: Bug report
description: Something does not work the way it should.
title: '[Bug]: '
labels:
- 'kind: bug'
body:
- type: markdown
  attributes:
    value: Thanks for reporting this. Short answers are fine. Never attach hardware serials, raw USB or HID data, recordings of device traffic, or memory dumps. You can still report a bug if `hyperfluxctl doctor` does not run.
- type: textarea
  id: outcome
  attributes:
    label: What happened?
    description: What did you do, and what did you see?
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: What did you expect to happen?
  validations:
    required: true
- type: input
  id: devices
  attributes:
    label: Your devices
    description: The keyboard and mouse models, and whether they were on the HyperFlux receiver, a USB cable, or Bluetooth.
    placeholder: Keyboard and mouse models; how they were connected
  validations:
    required: true
- type: input
  id: environment
  attributes:
    label: Your system
    description: Linux distribution, kernel version (`uname -r`), HyperFlux version (`pacman -Q hyperflux-next-linux`), and the app you used.
    placeholder: Arch Linux; 6.x; 2.0.x; OpenRGB
  validations:
    required: true
- type: textarea
  id: doctor-reference
  attributes:
    label: Output of `hyperfluxctl doctor`
    description: Optional. Run `hyperfluxctl doctor` in a terminal and paste what it prints. Leave this blank if it does not run.
- type: textarea
  id: support-preview
  attributes:
    label: Support bundle preview
    description: Optional. Paste the output of `hyperfluxctl support-bundle --preview`. It only prints what a support bundle would contain; nothing is uploaded.
    render: json
- type: checkboxes
  id: privacy
  attributes:
    label: Before you submit
    options:
    - label: I removed serial numbers, machine and user names, private file paths, and raw USB or HID data.
      required: true
