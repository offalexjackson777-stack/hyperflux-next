# Generated by ./hfx generate. Do not edit manually.
name: Device support request
description: Request support or contribute public capability information for a device.
title: '[Device]: '
labels:
- 'kind: device-support'
body:
- type: markdown
  attributes:
    value: A support request does not claim qualification or authorize hardware writes. Public sources and read-only observations are welcome; physical tests need a separate bounded plan.
- type: input
  id: model
  attributes:
    label: Device model
    description: The name the device is sold under.
    placeholder: Vendor and model
  validations:
    required: true
- type: input
  id: pid
  attributes:
    label: Product ID, if known
    description: Optional. With the device connected by cable, `lsusb` shows it as `1532:xxxx`; the part after the colon is the product ID.
    placeholder: 1532:0000
- type: dropdown
  id: route
  attributes:
    label: How is it connected?
    options:
    - HyperFlux receiver
    - USB cable
    - Bluetooth
    - Other or unknown
  validations:
    required: true
- type: textarea
  id: capabilities
  attributes:
    label: What happened?
    description: Describe what you tried, what works, and what does not. Mention any public page or project that already supports the device.
  validations:
    required: true
- type: input
  id: doctor-reference
  attributes:
    label: Doctor reference, if available
    description: The privacy-safe hfx reference printed by hyperfluxctl doctor.
    placeholder: hfx-...
- type: textarea
  id: support-preview
  attributes:
    label: Support preview, if available
    description: Paste `hyperfluxctl support-bundle --preview`. This performs no upload or active receiver query.
    render: json
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy confirmation
    options:
    - label: I removed serials, stable host identifiers, raw transport payloads, and private paths.
      required: true
