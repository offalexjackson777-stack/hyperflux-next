# Generated by ./hfx generate. Do not edit manually.
name: Device support request
description: Ask for a device to work with HyperFlux, or tell us how one behaves.
title: '[Device]: '
labels:
- 'kind: device-support'
body:
- type: markdown
  attributes:
    value: Opening a request does not mean the device is supported yet. Links to public pages and what you have seen on your own system are welcome. Nobody will ask you to send test commands to your device without agreeing a plan with you first.
- type: input
  id: model
  attributes:
    label: Device model
    description: The name the device is sold under.
    placeholder: Vendor and model
  validations:
    required: true
- type: input
  id: pid
  attributes:
    label: Product ID, if known
    description: Optional. With the device connected by cable, `lsusb` shows it as `1532:xxxx`; the part after the colon is the product ID.
    placeholder: 1532:0000
- type: dropdown
  id: route
  attributes:
    label: How is it connected?
    options:
    - HyperFlux receiver
    - USB cable
    - Bluetooth
    - Other or unknown
  validations:
    required: true
- type: textarea
  id: capabilities
  attributes:
    label: What works and what does not?
    description: Describe what you tried. Mention any public page or project that already supports the device.
  validations:
    required: true
- type: textarea
  id: qualification-report
  attributes:
    label: Output of `hyperfluxctl qualification --json`
    description: Run `hyperfluxctl qualification --json` with the device connected and paste what it prints, unchanged. It only reads what the HyperFlux service already knows; it holds no serial numbers or file paths, and nothing is sent to the device or uploaded. Leave this blank if the command does not run.
    render: json
- type: checkboxes
  id: owner-check
  attributes:
    label: If your device is listed as expected to work, what did you check?
    description: Only tick what you saw yourself. A maintainer uses these with your report to mark the device as confirmed by owners.
    options:
    - label: 'While it was connected through the receiver, it worked normally: the pointer moved and the buttons clicked, or the keys typed.'
    - label: I changed its lighting in Polychromatic or another OpenRazer app, and the device changed.
    - label: I changed its lighting in OpenRGB, and the device changed.
- type: textarea
  id: doctor-reference
  attributes:
    label: Output of `hyperfluxctl doctor`
    description: Optional. Run `hyperfluxctl doctor` in a terminal and paste what it prints. Leave this blank if it does not run.
- type: textarea
  id: support-preview
  attributes:
    label: Support bundle preview
    description: Optional. Paste the output of `hyperfluxctl support-bundle --preview`. It only prints what a support bundle would contain; nothing is uploaded.
    render: json
- type: checkboxes
  id: privacy
  attributes:
    label: Before you submit
    options:
    - label: I removed serial numbers, machine and user names, private file paths, and raw USB or HID data.
      required: true
