    - name: Prepare exact upstream sources
      run: ./hfx ci prepare --image "$HFX_CI_IMAGE"
    - name: Build the package artifacts offline
      run: ./hfx ci package --image "$HFX_CI_IMAGE" --output build/ci/distributions/artifacts
    - name: Build, lint, install, and compile the Ubuntu 24.04 packages
      env:
        HFX_RELEASE_IMAGE: docker.io/library/ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b
        HFX_DISTRIBUTION: ubuntu
        HFX_RELEASE_NAME: Ubuntu 24.04
