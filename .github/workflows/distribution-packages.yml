        cache-to: type=gha,mode=max,scope=hyperflux-next-development,ignore-error=true
    - name: Prepare exact upstream sources
      run: ./hfx ci prepare --image "$HFX_CI_IMAGE"
    - name: Build the package artifacts offline
      run: ./hfx ci package --image "$HFX_CI_IMAGE" --output build/ci/distributions/artifacts
    - name: Build, lint, install, and compile the Ubuntu 26.10 packages
      env:
        HFX_RELEASE_IMAGE: docker.io/library/ubuntu@sha256:1b798ba0017f24244ca02af25e3cfb1160db35e270e7b3beef708910b468bd92
        HFX_DISTRIBUTION: ubuntu
        HFX_RELEASE_NAME: Ubuntu 26.10
