            needed=$(objdump -T "$file" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)
            echo "$file needs glibc ${needed:-none}; $HFX_RELEASE_NAME has $glibc"
            if [ -n "$needed" ] && dpkg --compare-versions "$needed" gt "$glibc"; then exit 1; fi
          done
          apt-get purge -y hyperflux-next-linux hyperflux-next-dkms
      run: docker run --rm --security-opt no-new-privileges --env HFX_HOST_OWNER="$(id -u):$(id -g)" --env HFX_DISTRIBUTION --env HFX_RELEASE_NAME --env HFX_RELEASE_SOURCES --env HFX_RELEASE_HEADERS --env HFX_PACKAGE_CHECKS --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" "$HFX_RELEASE_IMAGE" /bin/bash -c "$HFX_PACKAGE_CHECKS"
    - name: Upload hyperflux-distribution-packages
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: hyperflux-distribution-packages
        path: |-
          build/ci/distributions/ubuntu
          build/ci/distributions/debian
        if-no-files-found: warn
        retention-days: 14
