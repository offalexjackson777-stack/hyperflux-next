    - name: Build, lint, install, and compile the Fedora 44 packages
      env:
        HFX_RELEASE_IMAGE: registry.fedoraproject.org/fedora@sha256:923dd7d4362a78ef7edc1887cb599720e9f59ff8669a38c81062c6e2aaa83204
        HFX_DISTRIBUTION: fedora
        HFX_RELEASE_NAME: Fedora 44
        HFX_RELEASE_SOURCES: ''
        HFX_RELEASE_HEADERS: kernel-devel kernel-devel/fedora
        HFX_RELEASE_INSTALL: dnf install -y --setopt=install_weak_deps=False
        HFX_RELEASE_REMOVE: dnf remove -y
        HFX_OPENRAZER_REPOSITORY: https://download.opensuse.org/repositories/hardware:/razer/Fedora_44
        HFX_OPENRAZER_SOURCES: install -m 0644 "$repository" /etc/yum.repos.d/hardware_razer.repo
        HFX_OPENRAZER_KEY: E96C496E4E77C159C2FCA053062F9FD4D6D11CE4
        HFX_PACKAGE_CHECKS: |
          set -eu
          output=build/ci/distributions
          trap 'chown -R "$HFX_HOST_OWNER" "$output"' EXIT
          eval "$HFX_RELEASE_SOURCES"
          # dkms --rpm_safe_upgrade reads the process list.
          $HFX_RELEASE_INSTALL binutils dkms git kmod openssl procps python3 rpm-build rpmlint
          # PACKAGE/REPOSITORY adds the version that repository ships next to the newest one,
          # while dependencies still resolve against every repository.
          for headers in $HFX_RELEASE_HEADERS; do
            case $headers in
              */*)
                release=$(dnf repoquery --quiet --repo "${headers#*/}" --latest-limit 1 --queryformat '%{version}-%{release}' "${headers%/*}")
                test -n "$release"
                $HFX_RELEASE_INSTALL "${headers%/*}-$release"
                ;;
              *) $HFX_RELEASE_INSTALL "$headers" ;;
            esac
          done
          git config --global --add safe.directory "$PWD"
          rpms=$output/$HFX_DISTRIBUTION
          ./hfx package distro --distribution "$HFX_DISTRIBUTION" --build-manifest "$output/artifacts/package-build-manifest.json" --output "$rpms"
          packages=$rpms/packages
          for rpm in "$packages"/*.rpm; do
            rpm -qpi --nosignature "$rpm"
            rpm -qplv --nosignature "$rpm"
            rpm -qp --nosignature --requires --scripts "$rpm"
          done
          # rpmlint reports warnings and fails on any error the generated configuration
          # does not accept by name; its exit status differs between releases, so read the summary.
          report=$(rpmlint --config "$rpms/rpmlint" "$packages"/*.rpm 2>&1) || :
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -q 'checked; 0 errors,'
          $HFX_RELEASE_INSTALL "./$packages"/hyperflux-next-dkms-*.rpm "./$packages"/hyperflux-next-linux-*.rpm
          if find /etc/systemd -name '*hyperflux*' -print | grep -q .; then
            echo "Installing the packages enabled a service." >&2
            exit 1
          fi
          source=$(find /usr/src -maxdepth 1 -name 'hid-hyperflux-next-*' -print -quit)
          version=${source##*/hid-hyperflux-next-}
          test -n "$version"
          dkms status -m hid-hyperflux-next -v "$version" | grep -q .
          check_module() {
            module=$(find "/var/lib/dkms/hid-hyperflux-next/$version/$1" -name 'hid[-_]hyperflux[-_]next.ko*' -print -quit)
            test -n "$module"
            modinfo "$module"
            test "$(modinfo -F vermagic "$module" | cut -d' ' -f1)" = "$1"
          }
          # Kernel development files live under /usr/src. An installed kernel links
          # /lib/modules/KERNEL/build to them; the image has no kernel, so the link is
          # missing. dkms.conf builds wherever DKMS finds the kernel sources, so the
          # driver is first built with only --kernelsourcedir naming them. DKMS looks for
          # the kernel's signing tool under /lib/modules/KERNEL/build alone, so the link
          # is then made and the driver built again, this time signed.
          seen=
          built=0
          for directory in /lib/modules/*/build /usr/src/kernels/* /usr/src/linux-*-obj/*/*; do
            test -f "$directory/include/config/kernel.release" || continue
            kernel=$(cat "$directory/include/config/kernel.release")
            case " $seen " in *" $kernel "*) continue ;; esac
            seen="$seen $kernel"
            if [ ! -e "/lib/modules/$kernel/build" ]; then
              dkms build --force -m hid-hyperflux-next -v "$version" -k "$kernel" --kernelsourcedir "$directory"
              check_module "$kernel"
              mkdir -p "/lib/modules/$kernel"
              ln -s "$directory" "/lib/modules/$kernel/build"
            fi
            dkms build --force -m hid-hyperflux-next -v "$version" -k "$kernel"
            check_module "$kernel"
            built=$((built + 1))
          done
          test "$built" -ge "$(set -- $HFX_RELEASE_HEADERS; echo $#)"
          # DKMS signs the driver with the key the Secure Boot guide enrolls.
          test -f /var/lib/dkms/mok.pub
          openssl x509 -inform DER -in /var/lib/dkms/mok.pub -noout -subject
          # Full: the OpenRazer driver package stands in for OpenRazer's own one from
          # the openSUSE Build Service, which the release itself does not ship, so that
          # repository's stock OpenRazer service and Python client install on top of it.
          $HFX_RELEASE_INSTALL "./$packages"/hyperflux-next-openrazer-driver-dkms-*.rpm "./$packages"/hyperflux-next-full-*.rpm
          rpm -q --whatprovides openrazer-kernel-modules-dkms | grep -q '^hyperflux-next-openrazer-driver-dkms-'
          # Trust the repository's signing key only when it is the pinned one. The
          # repository keeps its package signature checks on.
          key=$(mktemp)
          curl -fsSL --proto '=https' "$HFX_OPENRAZER_REPOSITORY/repodata/repomd.xml.key" -o "$key"
          test "$(gpg --show-keys --with-colons "$key" | grep -c '^pub:')" -eq 1
          test "$(gpg --show-keys --with-colons "$key" | grep '^fpr:' | head -n 1 | cut -d: -f10)" = "$HFX_OPENRAZER_KEY"
          rpm --import "$key"
          repository=$(mktemp)
          curl -fsSL --proto '=https' "$HFX_OPENRAZER_REPOSITORY/hardware:razer.repo" -o "$repository"
          grep -qx 'gpgcheck=1' "$repository"
          grep -qx "baseurl=$HFX_OPENRAZER_REPOSITORY/" "$repository"
          # The package manager reads the key from the checked copy, never a fresh download.
          sed -i "s|^gpgkey=.*|gpgkey=file://$key|" "$repository"
          eval "$HFX_OPENRAZER_SOURCES"
          # zypper's --allow-unsigned-rpm covers only RPM files named on the command line.
          $HFX_RELEASE_INSTALL openrazer-daemon python3-openrazer
          if rpm -q openrazer-kernel-modules-dkms >/dev/null 2>&1; then
            echo "OpenRazer's own driver package was installed next to Full." >&2
            exit 1
          fi
          rpm -q --whatprovides openrazer-kernel-modules-dkms | grep -q '^hyperflux-next-openrazer-driver-dkms-'
          keyid=$(printf '%s' "$HFX_OPENRAZER_KEY" | tail -c 16 | tr 'A-F' 'a-f')
          for package in openrazer-daemon python3-openrazer; do
            rpm -q --queryformat '%{RSAHEADER:pgpsig}\n' "$package" | grep -q "Key ID $keyid\$"
          done
          if find /etc/systemd \( -name '*hyperflux*' -o -name '*openrazer*' \) -print | grep -q .; then
            echo "Installing Full or the stock OpenRazer service enabled a service." >&2
            exit 1
          fi
          source=$(find /usr/src -maxdepth 1 -name 'openrazer-driver-*' -print -quit)
          openrazer=${source##*/openrazer-driver-}
          test -n "$openrazer"
          dkms status -m openrazer-driver -v "$openrazer" | grep -q .
          built=0
          for kernel in $seen; do
            dkms build --force -m openrazer-driver -v "$openrazer" -k "$kernel"
            module=$(find "/var/lib/dkms/openrazer-driver/$openrazer/$kernel" -name 'razerkbd.ko*' -print -quit)
            test -n "$module"
            test "$(modinfo -F vermagic "$module" | cut -d' ' -f1)" = "$kernel"
            built=$((built + 1))
          done
          test "$built" -ge "$(set -- $HFX_RELEASE_HEADERS; echo $#)"
          glibc=$(ldd --version | head -n 1 | awk '{print $NF}')
          floor=$(rpm -q --requires hyperflux-next-linux | sed -n 's/^glibc >= //p')
          test -n "$floor"
          newer() { test "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" != "$2"; }
          for file in $(rpm -ql hyperflux-next-linux hyperflux-next-full); do
            test -f "$file" && test ! -L "$file" || continue
            head -c 4 "$file" | grep -q 'ELF' || continue
            needed=$(objdump -T "$file" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)
            # Weak references may name a newer glibc; the program checks for them at run time.
            strong=$(objdump -T "$file" | awk '$2 != "w"' | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)
            echo "$file needs glibc ${strong:-none} (${needed:-none} with weak references); the floor is $floor, $HFX_RELEASE_NAME has $glibc"
            if [ -n "$needed" ] && newer "$needed" "$glibc"; then exit 1; fi
            if [ -n "$strong" ] && newer "$strong" "$floor"; then exit 1; fi
          done
          $HFX_RELEASE_REMOVE openrazer-daemon python3-openrazer hyperflux-next-full hyperflux-next-openrazer-driver-dkms hyperflux-next-linux hyperflux-next-dkms
          if rpm -qa 'openrazer-*' 'python3-openrazer' | grep -q .; then
            echo "Removing the packages left an OpenRazer package installed." >&2
            exit 1
          fi
          if dkms status | grep -q .; then
            echo "Removing the packages left a driver registered with DKMS." >&2
            exit 1
          fi
      run: docker run --rm --security-opt no-new-privileges --env HFX_HOST_OWNER="$(id -u):$(id -g)" --env HFX_DISTRIBUTION --env HFX_RELEASE_NAME --env HFX_RELEASE_SOURCES --env HFX_RELEASE_HEADERS --env HFX_RELEASE_INSTALL --env HFX_RELEASE_REMOVE --env HFX_OPENRAZER_REPOSITORY --env HFX_OPENRAZER_SOURCES --env HFX_OPENRAZER_KEY --env HFX_PACKAGE_CHECKS --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" "$HFX_RELEASE_IMAGE" /bin/bash -c "$HFX_PACKAGE_CHECKS"
    - name: Build, lint, install, and compile the openSUSE Tumbleweed packages
      env:
        HFX_RELEASE_IMAGE: registry.opensuse.org/opensuse/tumbleweed@sha256:fe80b7a696238a86c273cb9efd798a5d56240567b0b7ab8ed3bf4606a2e117ac
        HFX_DISTRIBUTION: opensuse
        HFX_RELEASE_NAME: openSUSE Tumbleweed
        HFX_RELEASE_SOURCES: ''
        HFX_RELEASE_HEADERS: kernel-longterm-devel kernel-default-devel
        HFX_RELEASE_INSTALL: zypper --non-interactive install --no-recommends --allow-unsigned-rpm
        HFX_RELEASE_REMOVE: zypper --non-interactive remove
        HFX_OPENRAZER_REPOSITORY: https://download.opensuse.org/repositories/hardware:/razer/openSUSE_Tumbleweed
        HFX_OPENRAZER_SOURCES: install -m 0644 "$repository" /etc/zypp/repos.d/hardware_razer.repo && zypper --non-interactive refresh hardware_razer
        HFX_OPENRAZER_KEY: E96C496E4E77C159C2FCA053062F9FD4D6D11CE4
        HFX_PACKAGE_CHECKS: |
          set -eu
          output=build/ci/distributions
          trap 'chown -R "$HFX_HOST_OWNER" "$output"' EXIT
          eval "$HFX_RELEASE_SOURCES"
          # dkms --rpm_safe_upgrade reads the process list.
          $HFX_RELEASE_INSTALL binutils dkms git kmod openssl procps python3 rpm-build rpmlint
          # PACKAGE/REPOSITORY adds the version that repository ships next to the newest one,
          # while dependencies still resolve against every repository.
          for headers in $HFX_RELEASE_HEADERS; do
            case $headers in
              */*)
                release=$(dnf repoquery --quiet --repo "${headers#*/}" --latest-limit 1 --queryformat '%{version}-%{release}' "${headers%/*}")
                test -n "$release"
                $HFX_RELEASE_INSTALL "${headers%/*}-$release"
                ;;
              *) $HFX_RELEASE_INSTALL "$headers" ;;
            esac
          done
          git config --global --add safe.directory "$PWD"
          rpms=$output/$HFX_DISTRIBUTION
          ./hfx package distro --distribution "$HFX_DISTRIBUTION" --build-manifest "$output/artifacts/package-build-manifest.json" --output "$rpms"
          packages=$rpms/packages
          for rpm in "$packages"/*.rpm; do
            rpm -qpi --nosignature "$rpm"
            rpm -qplv --nosignature "$rpm"
            rpm -qp --nosignature --requires --scripts "$rpm"
          done
          # rpmlint reports warnings and fails on any error the generated configuration
          # does not accept by name; its exit status differs between releases, so read the summary.
          report=$(rpmlint --config "$rpms/rpmlint" "$packages"/*.rpm 2>&1) || :
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -q 'checked; 0 errors,'
          $HFX_RELEASE_INSTALL "./$packages"/hyperflux-next-dkms-*.rpm "./$packages"/hyperflux-next-linux-*.rpm
          if find /etc/systemd -name '*hyperflux*' -print | grep -q .; then
            echo "Installing the packages enabled a service." >&2
            exit 1
          fi
          source=$(find /usr/src -maxdepth 1 -name 'hid-hyperflux-next-*' -print -quit)
          version=${source##*/hid-hyperflux-next-}
          test -n "$version"
          dkms status -m hid-hyperflux-next -v "$version" | grep -q .
          check_module() {
            module=$(find "/var/lib/dkms/hid-hyperflux-next/$version/$1" -name 'hid[-_]hyperflux[-_]next.ko*' -print -quit)
            test -n "$module"
            modinfo "$module"
            test "$(modinfo -F vermagic "$module" | cut -d' ' -f1)" = "$1"
          }
          # Kernel development files live under /usr/src. An installed kernel links
          # /lib/modules/KERNEL/build to them; the image has no kernel, so the link is
          # missing. dkms.conf builds wherever DKMS finds the kernel sources, so the
          # driver is first built with only --kernelsourcedir naming them. DKMS looks for
          # the kernel's signing tool under /lib/modules/KERNEL/build alone, so the link
          # is then made and the driver built again, this time signed.
          seen=
          built=0
          for directory in /lib/modules/*/build /usr/src/kernels/* /usr/src/linux-*-obj/*/*; do
            test -f "$directory/include/config/kernel.release" || continue
            kernel=$(cat "$directory/include/config/kernel.release")
            case " $seen " in *" $kernel "*) continue ;; esac
            seen="$seen $kernel"
            if [ ! -e "/lib/modules/$kernel/build" ]; then
              dkms build --force -m hid-hyperflux-next -v "$version" -k "$kernel" --kernelsourcedir "$directory"
              check_module "$kernel"
              mkdir -p "/lib/modules/$kernel"
              ln -s "$directory" "/lib/modules/$kernel/build"
            fi
            dkms build --force -m hid-hyperflux-next -v "$version" -k "$kernel"
            check_module "$kernel"
            built=$((built + 1))
          done
          test "$built" -ge "$(set -- $HFX_RELEASE_HEADERS; echo $#)"
          # DKMS signs the driver with the key the Secure Boot guide enrolls.
          test -f /var/lib/dkms/mok.pub
          openssl x509 -inform DER -in /var/lib/dkms/mok.pub -noout -subject
          # Full: the OpenRazer driver package stands in for OpenRazer's own one from
          # the openSUSE Build Service, which the release itself does not ship, so that
          # repository's stock OpenRazer service and Python client install on top of it.
          $HFX_RELEASE_INSTALL "./$packages"/hyperflux-next-openrazer-driver-dkms-*.rpm "./$packages"/hyperflux-next-full-*.rpm
          rpm -q --whatprovides openrazer-kernel-modules-dkms | grep -q '^hyperflux-next-openrazer-driver-dkms-'
          # Trust the repository's signing key only when it is the pinned one. The
          # repository keeps its package signature checks on.
          key=$(mktemp)
          curl -fsSL --proto '=https' "$HFX_OPENRAZER_REPOSITORY/repodata/repomd.xml.key" -o "$key"
          test "$(gpg --show-keys --with-colons "$key" | grep -c '^pub:')" -eq 1
          test "$(gpg --show-keys --with-colons "$key" | grep '^fpr:' | head -n 1 | cut -d: -f10)" = "$HFX_OPENRAZER_KEY"
          rpm --import "$key"
          repository=$(mktemp)
          curl -fsSL --proto '=https' "$HFX_OPENRAZER_REPOSITORY/hardware:razer.repo" -o "$repository"
          grep -qx 'gpgcheck=1' "$repository"
          grep -qx "baseurl=$HFX_OPENRAZER_REPOSITORY/" "$repository"
          # The package manager reads the key from the checked copy, never a fresh download.
          sed -i "s|^gpgkey=.*|gpgkey=file://$key|" "$repository"
          eval "$HFX_OPENRAZER_SOURCES"
          # zypper's --allow-unsigned-rpm covers only RPM files named on the command line.
          $HFX_RELEASE_INSTALL openrazer-daemon python3-openrazer
          if rpm -q openrazer-kernel-modules-dkms >/dev/null 2>&1; then
            echo "OpenRazer's own driver package was installed next to Full." >&2
            exit 1
          fi
          rpm -q --whatprovides openrazer-kernel-modules-dkms | grep -q '^hyperflux-next-openrazer-driver-dkms-'
          keyid=$(printf '%s' "$HFX_OPENRAZER_KEY" | tail -c 16 | tr 'A-F' 'a-f')
          for package in openrazer-daemon python3-openrazer; do
            rpm -q --queryformat '%{RSAHEADER:pgpsig}\n' "$package" | grep -q "Key ID $keyid\$"
          done
          if find /etc/systemd \( -name '*hyperflux*' -o -name '*openrazer*' \) -print | grep -q .; then
            echo "Installing Full or the stock OpenRazer service enabled a service." >&2
            exit 1
          fi
          source=$(find /usr/src -maxdepth 1 -name 'openrazer-driver-*' -print -quit)
          openrazer=${source##*/openrazer-driver-}
          test -n "$openrazer"
          dkms status -m openrazer-driver -v "$openrazer" | grep -q .
          built=0
          for kernel in $seen; do
            dkms build --force -m openrazer-driver -v "$openrazer" -k "$kernel"
            module=$(find "/var/lib/dkms/openrazer-driver/$openrazer/$kernel" -name 'razerkbd.ko*' -print -quit)
            test -n "$module"
            test "$(modinfo -F vermagic "$module" | cut -d' ' -f1)" = "$kernel"
            built=$((built + 1))
          done
          test "$built" -ge "$(set -- $HFX_RELEASE_HEADERS; echo $#)"
          glibc=$(ldd --version | head -n 1 | awk '{print $NF}')
          floor=$(rpm -q --requires hyperflux-next-linux | sed -n 's/^glibc >= //p')
          test -n "$floor"
          newer() { test "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" != "$2"; }
          for file in $(rpm -ql hyperflux-next-linux hyperflux-next-full); do
            test -f "$file" && test ! -L "$file" || continue
            head -c 4 "$file" | grep -q 'ELF' || continue
            needed=$(objdump -T "$file" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)
            # Weak references may name a newer glibc; the program checks for them at run time.
            strong=$(objdump -T "$file" | awk '$2 != "w"' | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)
            echo "$file needs glibc ${strong:-none} (${needed:-none} with weak references); the floor is $floor, $HFX_RELEASE_NAME has $glibc"
            if [ -n "$needed" ] && newer "$needed" "$glibc"; then exit 1; fi
            if [ -n "$strong" ] && newer "$strong" "$floor"; then exit 1; fi
          done
          $HFX_RELEASE_REMOVE openrazer-daemon python3-openrazer hyperflux-next-full hyperflux-next-openrazer-driver-dkms hyperflux-next-linux hyperflux-next-dkms
          if rpm -qa 'openrazer-*' 'python3-openrazer' | grep -q .; then
            echo "Removing the packages left an OpenRazer package installed." >&2
            exit 1
          fi
          if dkms status | grep -q .; then
            echo "Removing the packages left a driver registered with DKMS." >&2
            exit 1
          fi
      run: docker run --rm --security-opt no-new-privileges --env HFX_HOST_OWNER="$(id -u):$(id -g)" --env HFX_DISTRIBUTION --env HFX_RELEASE_NAME --env HFX_RELEASE_SOURCES --env HFX_RELEASE_HEADERS --env HFX_RELEASE_INSTALL --env HFX_RELEASE_REMOVE --env HFX_OPENRAZER_REPOSITORY --env HFX_OPENRAZER_SOURCES --env HFX_OPENRAZER_KEY --env HFX_PACKAGE_CHECKS --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" "$HFX_RELEASE_IMAGE" /bin/bash -c "$HFX_PACKAGE_CHECKS"
    - name: Assemble the unsigned package repository site
      env:
        HFX_OCI_ENGINE: docker
      run: ./hfx repositories assemble --packages ubuntu=build/ci/distributions/ubuntu/packages --packages debian=build/ci/distributions/debian/packages --packages fedora=build/ci/distributions/fedora/packages --packages opensuse=build/ci/distributions/opensuse/packages --output build/ci/repositories/site
    - name: Upload hyperflux-package-repositories-unsigned
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: hyperflux-package-repositories-unsigned
        path: build/ci/repositories/site
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
    - name: Upload hyperflux-distribution-packages
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: hyperflux-distribution-packages
        path: |-
          build/ci/distributions/ubuntu
          build/ci/distributions/debian
          build/ci/distributions/fedora
          build/ci/distributions/opensuse
        if-no-files-found: warn
        retention-days: 14
