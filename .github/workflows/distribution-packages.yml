        path: build/ci/repositories/site
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
    - name: Upload hyperflux-distribution-packages
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
