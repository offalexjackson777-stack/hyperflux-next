name: Distribution packages
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 23 6 * * 3
permissions:
  contents: read
concurrency:
  group: distribution-packages-${{ github.ref }}
  cancel-in-progress: true
env:
  HFX_CI_IMAGE: hyperflux-next-dev:ci
jobs:
  distribution-packages:
    name: Distribution packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Check out exact source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Restore exact upstream sources
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .hfx/upstreams
        key: hfx-upstreams-${{ runner.os }}-${{ hashFiles('integrations/catalog.json') }}
    - name: Restore verified build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .hfx/cargo
          target
        key: hfx-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'toolchains/development-environment.json') }}
        restore-keys: |
          hfx-build-${{ runner.os }}-
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build the pinned development environment
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: .devcontainer/Containerfile
        load: true
        push: false
        tags: ${{ env.HFX_CI_IMAGE }}
        cache-from: type=gha,scope=hyperflux-next-development
        cache-to: type=gha,mode=max,scope=hyperflux-next-development,ignore-error=true
    - name: Prepare exact upstream sources
      run: ./hfx ci prepare --image "$HFX_CI_IMAGE"
    - name: Build the package artifacts offline
      run: ./hfx ci package --image "$HFX_CI_IMAGE" --output build/ci/distributions/artifacts
    - name: Build, lint, install, and compile the Ubuntu 24.04 packages
      env:
        HFX_RELEASE_IMAGE: docker.io/library/ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b
        HFX_DISTRIBUTION: ubuntu
        HFX_RELEASE_NAME: Ubuntu 24.04
        HFX_RELEASE_SOURCES: ''
        HFX_RELEASE_HEADERS: linux-headers-generic linux-headers-generic-hwe-24.04
        HFX_PACKAGE_CHECKS: |
          set -eu
          output=build/ci/distributions
          trap 'chown -R "$HFX_HOST_OWNER" "$output"' EXIT
          export DEBIAN_FRONTEND=noninteractive
          eval "$HFX_RELEASE_SOURCES"
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates dkms git kmod lintian python3
          # The release's own kernel headers first, so the newer kernel adds to them.
          for headers in $HFX_RELEASE_HEADERS; do
            apt-get install -y --no-install-recommends "$headers"
          done
          git config --global --add safe.directory "$PWD"
          debs=$output/$HFX_DISTRIBUTION
          ./hfx package distro --distribution "$HFX_DISTRIBUTION" --build-manifest "$output/artifacts/package-build-manifest.json" --output "$debs"
          packages=$debs/packages
          for deb in "$packages"/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          lintian --fail-on error --allow-root --display-level '>=warning' "$packages"/*.deb
          # Refuse every service start a maintainer script might attempt.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 0755 /usr/sbin/policy-rc.d
          apt-get install -y --no-install-recommends "./$packages"/hyperflux-next-dkms_*.deb "./$packages"/hyperflux-next-linux_*.deb
          if find /etc/systemd -name '*hyperflux*' -print | grep -q .; then
            echo "Installing the packages enabled a service." >&2
            exit 1
          fi
          source=$(find /usr/src -maxdepth 1 -name 'hid-hyperflux-next-*' -print -quit)
          version=${source##*/hid-hyperflux-next-}
          test -n "$version"
          built=0
          for directory in /lib/modules/*/build; do
            test -f "$directory/Makefile" || continue
            kernel=$(basename "$(dirname "$directory")")
            dkms build --force -m hid-hyperflux-next -v "$version" -k "$kernel"
            module=$(find "/var/lib/dkms/hid-hyperflux-next/$version/$kernel" -name 'hid[-_]hyperflux[-_]next.ko*' -print -quit)
            test -n "$module"
            modinfo "$module"
            test "$(modinfo -F vermagic "$module" | cut -d' ' -f1)" = "$kernel"
            built=$((built + 1))
          done
          test "$built" -ge 2
          glibc=$(ldd --version | head -n 1 | awk '{print $NF}')
          for file in $(dpkg -L hyperflux-next-linux); do
            test -f "$file" && test ! -L "$file" || continue
            head -c 4 "$file" | grep -q 'ELF' || continue
            needed=$(objdump -T "$file" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)
            echo "$file needs glibc ${needed:-none}; $HFX_RELEASE_NAME has $glibc"
            if [ -n "$needed" ] && dpkg --compare-versions "$needed" gt "$glibc"; then exit 1; fi
          done
          apt-get purge -y hyperflux-next-linux hyperflux-next-dkms
      run: docker run --rm --security-opt no-new-privileges --env HFX_HOST_OWNER="$(id -u):$(id -g)" --env HFX_DISTRIBUTION --env HFX_RELEASE_NAME --env HFX_RELEASE_SOURCES --env HFX_RELEASE_HEADERS --env HFX_PACKAGE_CHECKS --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" "$HFX_RELEASE_IMAGE" /bin/bash -c "$HFX_PACKAGE_CHECKS"
    - name: Build, lint, install, and compile the Debian 13 packages
      env:
        HFX_RELEASE_IMAGE: docker.io/library/debian@sha256:bcf83fd8af414eda0c0a99d25a4e61dedd88e7aac7f7bc519d04555ff0c40ec5
        HFX_DISTRIBUTION: debian
        HFX_RELEASE_NAME: Debian 13
        HFX_RELEASE_SOURCES: echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
        HFX_RELEASE_HEADERS: linux-headers-amd64 linux-headers-amd64/trixie-backports
        HFX_PACKAGE_CHECKS: |
          set -eu
          output=build/ci/distributions
          trap 'chown -R "$HFX_HOST_OWNER" "$output"' EXIT
          export DEBIAN_FRONTEND=noninteractive
