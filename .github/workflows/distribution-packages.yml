    - name: Assemble the unsigned package repository site
      env:
        HFX_OCI_ENGINE: docker
      run: ./hfx repositories assemble --packages ubuntu=build/ci/distributions/ubuntu/packages --packages debian=build/ci/distributions/debian/packages --packages fedora=build/ci/distributions/fedora/packages --packages opensuse=build/ci/distributions/opensuse/packages --output build/ci/repositories/site
