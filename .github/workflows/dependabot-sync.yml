# Generated by ./hfx generate. Do not edit manually.
name: Dependabot sync
'on':
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: dependabot-sync-${{ github.head_ref }}
  cancel-in-progress: true
env:
  HFX_CI_IMAGE: hyperflux-next-dev:ci
jobs:
  dependabot-sync:
    name: Dependabot sync
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Require the sync deploy key
      env:
        SYNC_KEY_PRESENT: ${{ secrets.DEPENDABOT_SYNC_DEPLOY_KEY != '' }}
      run: |
        if [ "$SYNC_KEY_PRESENT" != true ]; then
          echo "::error::Add the DEPENDABOT_SYNC_DEPLOY_KEY Dependabot secret; see docs/generated/github-governance.md"
          exit 1
        fi
    - name: Check out the Dependabot branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.head_ref }}
        ssh-key: ${{ secrets.DEPENDABOT_SYNC_DEPLOY_KEY }}
        persist-credentials: true
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build the pinned development environment
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: .devcontainer/Containerfile
        load: true
        push: false
        tags: ${{ env.HFX_CI_IMAGE }}
        cache-from: type=gha,scope=hyperflux-next-development
        cache-to: type=gha,mode=max,scope=hyperflux-next-development,ignore-error=true
    - name: Carry the update into the authorities
      run: ./hfx ci dependency-sync --image "$HFX_CI_IMAGE"
    - name: Push the carried update
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: |
        if git diff --quiet; then
          echo "The update needs no authority change."
          exit 0
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add --update
        git commit --quiet --message 'build: carry the Dependabot update into the authorities'
        git push origin "HEAD:refs/heads/$HEAD_REF"
