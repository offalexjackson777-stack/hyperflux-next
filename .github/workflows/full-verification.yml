# Generated by ./hfx generate. Do not edit manually.
name: Full verification
'on':
  pull_request: {}
  workflow_dispatch: {}
  schedule:
  - cron: 17 3 * * 1
permissions:
  contents: read
concurrency:
  group: full-verification-${{ github.ref }}
  cancel-in-progress: false
env:
  HFX_CI_IMAGE: hyperflux-next-dev:ci
jobs:
  full-software:
    name: Full software
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Check out exact source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Restore exact upstream sources
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .hfx/upstreams
        key: hfx-upstreams-${{ runner.os }}-${{ hashFiles('integrations/catalog.json') }}
    - name: Restore verified build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .hfx/cargo
          target
        key: hfx-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'toolchains/development-environment.json') }}
        restore-keys: |
          hfx-build-${{ runner.os }}-
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build the pinned development environment
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: .devcontainer/Containerfile
        load: true
        push: false
        tags: ${{ env.HFX_CI_IMAGE }}
        cache-from: type=gha,scope=hyperflux-next-development
        cache-to: type=gha,mode=max,scope=hyperflux-next-development,ignore-error=true
    - name: Prepare exact upstream sources
      run: ./hfx ci prepare --image "$HFX_CI_IMAGE"
    - name: Qualify packaged OpenRGB isolation
      run: ./hfx ci qualify-openrgb --image "$HFX_CI_IMAGE" --output build/ci/openrgb-qualification
    - name: Run the complete software graph
      env:
        HFX_RELEASE_EVIDENCE: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'required' || 'structure' }}
      run: ./hfx ci verify --image "$HFX_CI_IMAGE" --lane full --output build/ci/full --openrgb-qualification build/ci/openrgb-qualification/binding.json --release-evidence "$HFX_RELEASE_EVIDENCE"
    - name: Publish bounded verification summary
      if: ${{ always() }}
      env:
        HFX_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      run: ./hfx ci summary --result build/ci/full/result.json --output "$GITHUB_STEP_SUMMARY" --source-revision "$HFX_SOURCE_REVISION"
    - name: Upload hyperflux-full-evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: hyperflux-full-evidence
        path: |-
          build/ci/full
          build/ci/openrgb-qualification
          build/rust-coverage-current.json
          build/rust-coverage-current.lcov
        if-no-files-found: error
        retention-days: 30
