# Generated by ./hfx generate. Do not edit manually.
name: Ubuntu packages
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 23 6 * * 3
permissions:
  contents: read
concurrency:
  group: ubuntu-packages-${{ github.ref }}
  cancel-in-progress: true
env:
  HFX_CI_IMAGE: hyperflux-next-dev:ci
jobs:
  ubuntu-packages:
    name: Ubuntu packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Check out exact source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Restore exact upstream sources
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .hfx/upstreams
        key: hfx-upstreams-${{ runner.os }}-${{ hashFiles('integrations/catalog.json') }}
    - name: Restore verified build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .hfx/cargo
          target
        key: hfx-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'toolchains/development-environment.json') }}
        restore-keys: |
          hfx-build-${{ runner.os }}-
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build the pinned development environment
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: .devcontainer/Containerfile
        load: true
        push: false
        tags: ${{ env.HFX_CI_IMAGE }}
        cache-from: type=gha,scope=hyperflux-next-development
        cache-to: type=gha,mode=max,scope=hyperflux-next-development,ignore-error=true
    - name: Prepare exact upstream sources
      run: ./hfx ci prepare --image "$HFX_CI_IMAGE"
    - name: Build the package artifacts offline
      run: ./hfx ci package --image "$HFX_CI_IMAGE" --output build/ci/ubuntu/artifacts
    - name: Build, lint, install, and compile the Ubuntu packages
      env:
        HFX_UBUNTU_IMAGE: docker.io/library/ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b
        HFX_UBUNTU_CHECKS: |
          set -eu
          trap 'chown -R "$HFX_HOST_OWNER" build/ci/ubuntu' EXIT
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates dkms git kmod lintian linux-headers-generic linux-headers-generic-hwe-24.04 python3
          git config --global --add safe.directory "$PWD"
          debs=build/ci/ubuntu/debs
          ./hfx package distro --distribution ubuntu --build-manifest build/ci/ubuntu/artifacts/package-build-manifest.json --output "$debs"
          packages=$debs/packages
          for deb in "$packages"/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          lintian --fail-on error --allow-root --display-level '>=warning' "$packages"/*.deb
          # Refuse every service start a maintainer script might attempt.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 0755 /usr/sbin/policy-rc.d
          apt-get install -y --no-install-recommends "./$packages"/hyperflux-next-dkms_*.deb "./$packages"/hyperflux-next-linux_*.deb
          if find /etc/systemd -name '*hyperflux*' -print | grep -q .; then
            echo "Installing the packages enabled a service." >&2
            exit 1
          fi
          built=0
          for directory in /lib/modules/*/build; do
            test -f "$directory/Makefile" || continue
            kernel=$(basename "$(dirname "$directory")")
            dkms build --force -m hid-hyperflux-next -v 2.1.0 -k "$kernel"
            module=$(find "/var/lib/dkms/hid-hyperflux-next/2.1.0/$kernel" -name 'hid[-_]hyperflux[-_]next.ko*' -print -quit)
            test -n "$module"
            modinfo "$module"
            test "$(modinfo -F vermagic "$module" | cut -d' ' -f1)" = "$kernel"
            built=$((built + 1))
          done
          test "$built" -ge 2
          glibc=$(ldd --version | head -n 1 | awk '{print $NF}')
          for file in $(dpkg -L hyperflux-next-linux); do
            test -f "$file" && test ! -L "$file" || continue
            head -c 4 "$file" | grep -q 'ELF' || continue
            needed=$(objdump -T "$file" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)
            echo "$file needs glibc ${needed:-none}; Ubuntu 24.04 has $glibc"
            if [ -n "$needed" ] && dpkg --compare-versions "$needed" gt "$glibc"; then exit 1; fi
          done
          apt-get purge -y hyperflux-next-linux hyperflux-next-dkms
      run: docker run --rm --security-opt no-new-privileges --env HFX_HOST_OWNER="$(id -u):$(id -g)" --env HFX_UBUNTU_CHECKS --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" "$HFX_UBUNTU_IMAGE" /bin/bash -c "$HFX_UBUNTU_CHECKS"
    - name: Upload hyperflux-ubuntu-packages
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: hyperflux-ubuntu-packages
        path: build/ci/ubuntu/debs
        if-no-files-found: warn
        retention-days: 14
