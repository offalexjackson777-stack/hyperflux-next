# Generated by ./hfx generate. Do not edit manually.
name: Kernel canary
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 41 5 * * 1
permissions:
  contents: read
concurrency:
  group: kernel-canary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel-canary:
    name: Kernel canary
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: docker.io/library/archlinux:base-devel@sha256:412efebb0eeef0ef322ff24ad73f82b1ba2d3b12377db4c5fbe3074c7e7e8678
    steps:
    - name: Install current kernel headers
      run: |
        set -eu
        printf '%s\n' 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
        pacman -Sy --noconfirm archlinux-keyring
        pacman -Su --noconfirm --needed bc cpio git libelf linux-headers linux-lts-headers openssl python python-yaml
    - name: Check out exact source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Stage the upcoming Arch kernel
      run: |
        set -eu
        staging=/opt/hfx-kernels/testing
        mkdir -p "$staging/db/local" "$staging/cache" "$staging/root"
        printf '%s\n' '[options]' 'Architecture = auto' 'SigLevel = Required DatabaseOptional' '[core-testing]' 'Include = /etc/pacman.d/mirrorlist' > "$staging/pacman.conf"
        testing() { pacman --config "$staging/pacman.conf" --dbpath "$staging/db" --cachedir "$staging/cache" "$@"; }
        testing -Sy
        if testing -Sddp core-testing/linux-headers > /dev/null 2>&1; then
          testing -Sddw --noconfirm core-testing/linux-headers
          bsdtar -xf "$staging"/cache/linux-headers-*.pkg.tar.zst -C "$staging/root"
        else
          echo "core-testing has no newer Arch kernel this week."
        fi
    - name: Prepare the newest mainline kernel
      run: |
        set -eu
        url=https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
        tags=$(git -c versionsort.suffix=-rc ls-remote --refs --sort=-version:refname --tags "$url" 'v*')
        tag=$(printf '%s\n' "$tags" | head -n 1 | sed 's#.*refs/tags/##')
        test -n "$tag" || { echo "No mainline tag found." >&2; exit 1; }
        echo "Newest mainline tag: $tag"
        git clone --quiet --depth 1 --branch "$tag" "$url" /opt/hfx-kernels/mainline
        make -C /opt/hfx-kernels/mainline defconfig
        # Distribution kernels leave CONFIG_WERROR off; with it on, W=1 warnings would read as interface breaks.
        /opt/hfx-kernels/mainline/scripts/config --file /opt/hfx-kernels/mainline/.config --disable WERROR
        make -C /opt/hfx-kernels/mainline olddefconfig
        make -C /opt/hfx-kernels/mainline -j"$(nproc)" modules_prepare
    - name: Prepare exact upstream sources
      run: ./hfx upstream prepare
    - name: Build the drivers against every kernel
      run: |
        set -eu
        set --
        for directory in /usr/lib/modules/*/build /opt/hfx-kernels/testing/root/usr/lib/modules/*/build /opt/hfx-kernels/mainline; do
          if [ -f "$directory/Makefile" ]; then set -- "$@" --header-dir "$directory"; fi
        done
        ./hfx kernel-canary --output build/ci/kernel-canary "$@"
    - name: Publish kernel canary summary
      if: ${{ always() }}
      run: if [ -f build/ci/kernel-canary/summary.md ]; then cat build/ci/kernel-canary/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
    - name: Upload hyperflux-kernel-canary
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: hyperflux-kernel-canary
        path: |-
          build/ci/kernel-canary/result.json
          build/ci/kernel-canary/summary.md
        if-no-files-found: warn
        retention-days: 30
